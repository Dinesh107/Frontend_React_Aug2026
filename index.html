    <form action="customer.cpp" method="POST">
      <label for="username">Username: </label>
      <input
        type="text"
        id="username"
        placeholder="dinesh_007"
        minlength="6"
        maxlength="20"
        required
      />
      <br /><br />

      <label for="password">Password: </label>
      <input type="password" id="password" />
      <br /><br />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="ganesh007@gmail.com" />
      <br /><br />

      <label for="phone">Phone no</label>
      <input
        type="tel"
        id="phone"
        placeholder="91-66658-67766"
        pattern="[0-9]{2}-[0-9]{5}-[0-9]{5}"
      />
      <br /><br />

      <label for="bday">Birthdate</label>
      <input type="date" id="bday" />
      <br /><br />

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" min="0" max="99" value="1" />
      <br /><br />


      <label for="title">tite: </label>

      <label for="title">Mr:</label>
      <input type="radio" id="Mr:" value="Mr:" name="title">
      <label for="title">Ms:</label>
      <input type="radio" id="Ms:" value="Ms:"  name="title">
      <label for="title">Dr:</label>
      <input type="radio" id="Dr:" value="Dr:"  name="title">
       <br /><br />
      <input type="submit" />
      <input type="reset" />
    </form>
